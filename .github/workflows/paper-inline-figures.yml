name: Build paper with appendix figures inline

on:
  push:
    branches:
      - paper/move-appendix-figures-inline
    paths:
      - .github/workflows/paper-inline-figures.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PDF_NAME: k3-out-of-core-paper-v0.pdf

    steps:
      - uses: actions/checkout@v4

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            lmodern fonts-dejavu-core poppler-utils

      - name: Build reader-facing manuscript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('paper/paper.md').read_text(encoding='utf-8')
          lines = source.splitlines()
          title = lines[0][2:].strip()
          body = '\n'.join(lines[1:]).lstrip()
          if '# Appendix' not in body:
              raise SystemExit('expected Appendix marker not found')
          main_body = body.split('# Appendix', 1)[0].rstrip() + '\n'

          for label in ('A1', 'A2', 'A3', 'A4', 'A5'):
              if main_body.count(f'![Figure {label}') != 1:
                  raise SystemExit(f'Figure {label} not inline exactly once')

          main_body = re.sub(r'(figures/generated/[^)\s]+)\.svg\)', r'\1.pdf)', main_body)
          main_body = re.sub(r'!\[[^\]]*\]\((figures/generated/[^)\s]+\.pdf)\)', r'![](\1)', main_body)

          out = Path('paper/build')
          out.mkdir(parents=True, exist_ok=True)
          escaped_title = title.replace('"', '\\"')
          front = (
              '---\n'
              f'title: "{escaped_title}"\n'
              'subtitle: "Preprint v0"\n'
              'date: "August 2026"\n'
              '---\n\n'
          )
          (out / 'paper-public.md').write_text(front + main_body, encoding='utf-8')
          PY

          pandoc paper/build/paper-public.md \
            --from=markdown+tex_math_single_backslash \
            --pdf-engine=xelatex \
            --resource-path=paper \
            -V papersize=letter \
            -V fontsize=10pt \
            -V geometry:margin=0.72in \
            -V mainfont='DejaVu Serif' \
            -V sansfont='DejaVu Sans' \
            -V monofont='DejaVu Sans Mono' \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -o "paper/build/${PDF_NAME}"

      - name: Validate PDF
        run: |
          set -euo pipefail
          pdfinfo "paper/build/${PDF_NAME}" | tee paper/build/pdfinfo.txt
          pdftotext "paper/build/${PDF_NAME}" paper/build/paper-v0.txt
          grep -q 'Cache-Aware Expert Routing' paper/build/paper-v0.txt
          grep -q '12. Conclusion' paper/build/paper-v0.txt
          for label in A1 A2 A3 A4 A5; do grep -q "Figure ${label}" paper/build/paper-v0.txt; done
          ! grep -q 'Artifact identities' paper/build/paper-v0.txt
          ! grep -q 'Appendix B' paper/build/paper-v0.txt
          ! grep -q 'Appendix C' paper/build/paper-v0.txt
          ! grep -q 'Appendix D' paper/build/paper-v0.txt
          ! grep -q 'Appendix E' paper/build/paper-v0.txt
          ! grep -q 'Prior-art comparability' paper/build/paper-v0.txt
          ! grep -Eq 'Figure [0-9]+: Figure' paper/build/paper-v0.txt
          sha256sum "paper/build/${PDF_NAME}" | tee paper/build/SHA256SUMS

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-inline-figures-pdf
          path: |
            paper/build/${{ env.PDF_NAME }}
            paper/build/SHA256SUMS
            paper/build/pdfinfo.txt
          if-no-files-found: error
