name: Publish paper v0 PDF

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper-v0-release.yml
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: paper-v0-release
  cancel-in-progress: true

jobs:
  build-and-release:
    if: github.event_name == 'push' || github.event.issue.title == '[automation] publish paper v0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 19a977cb884a87305279c7b90dc1a70f226e730e
      RELEASE_TAG: v0
      PDF_NAME: k3-out-of-core-paper-v0.pdf

    steps:
      - name: Report build start on PR 123
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/123/comments" \
            -f body="Paper v0 release build: **STARTED** — ${run_url}"

      - name: Check out merged manuscript snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            fonts-dejavu-core poppler-utils

      - name: Build reader-facing manuscript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('paper/paper.md').read_text(encoding='utf-8')
          lines = source.splitlines()
          if not lines or not lines[0].startswith('# '):
              raise SystemExit('paper/paper.md does not start with the expected title H1')

          title = lines[0][2:].strip()
          body = '\n'.join(lines[1:]).lstrip()
          appendix_marker = '# Appendix'
          if appendix_marker not in body:
              raise SystemExit('expected Appendix marker not found')

          main_body, appendix = body.split(appendix_marker, 1)
          appendix = appendix_marker + appendix
          b_marker = '## Appendix B — Systems diagnostics'
          e_marker = '## Appendix E — Scope'
          if b_marker not in appendix or e_marker not in appendix:
              raise SystemExit('expected public/internal appendix boundaries not found')

          scientific_appendices = appendix[appendix.index(b_marker):appendix.index(e_marker)].rstrip()
          public = main_body.rstrip() + '\n\n---\n\n# Appendix\n\n' + scientific_appendices + '\n'
          public = re.sub(r'(figures/generated/[^)\s]+)\.svg\)', r'\1.pdf)', public)

          out_dir = Path('paper/build')
          out_dir.mkdir(parents=True, exist_ok=True)
          escaped_title = title.replace('"', '\\"')
          front_matter = (
              '---\n'
              f'title: "{escaped_title}"\n'
              'subtitle: "Preprint v0"\n'
              'date: "August 2026"\n'
              '---\n\n'
          )
          (out_dir / 'paper-public.md').write_text(front_matter + public, encoding='utf-8')
          PY

          pandoc paper/build/paper-public.md \
            --from=markdown \
            --pdf-engine=xelatex \
            --resource-path=paper \
            -V papersize=letter \
            -V fontsize=10pt \
            -V geometry:margin=0.72in \
            -V mainfont='DejaVu Serif' \
            -V sansfont='DejaVu Sans' \
            -V monofont='DejaVu Sans Mono' \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -o "paper/build/${PDF_NAME}"

      - name: Validate public PDF
        run: |
          set -euo pipefail
          pdfinfo "paper/build/${PDF_NAME}" | tee paper/build/pdfinfo.txt
          pdftotext "paper/build/${PDF_NAME}" paper/build/paper-v0.txt

          grep -q 'Cache-Aware Expert Routing' paper/build/paper-v0.txt
          grep -q '12. Conclusion' paper/build/paper-v0.txt
          grep -q 'Appendix B' paper/build/paper-v0.txt
          grep -q 'Appendix D' paper/build/paper-v0.txt
          ! grep -q 'Artifact identities' paper/build/paper-v0.txt
          ! grep -q 'Appendix E' paper/build/paper-v0.txt
          ! grep -q 'Prior-art comparability' paper/build/paper-v0.txt

          pages=$(awk '/^Pages:/ {print $2}' paper/build/pdfinfo.txt)
          test -n "$pages"
          test "$pages" -gt 5
          pdftoppm -f 1 -singlefile -png -r 120 \
            "paper/build/${PDF_NAME}" paper/build/page-1 >/dev/null 2>&1
          test -s paper/build/page-1.png
          sha256sum "paper/build/${PDF_NAME}" | tee paper/build/SHA256SUMS

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-v0-pdf
          path: |
            paper/build/${{ env.PDF_NAME }}
            paper/build/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release v0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Paper v0
          prerelease: true
          generate_release_notes: false
          body: |
            First reader-facing PDF snapshot of the merged K3 out-of-core manuscript.

            Source manuscript commit: `${{ env.SOURCE_SHA }}` (merged PR #123).

            This v0 contains the paper proper and scientific Appendices B-D. Internal/operational Appendix A (artifact identities), Appendix E (scope bookkeeping), and Appendix F (prior-art comparability bookkeeping) are intentionally excluded from the PDF.
          files: |
            paper/build/${{ env.PDF_NAME }}
            paper/build/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Report result on PR 123
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${PDF_NAME}"

          if [ "$JOB_STATUS" = "success" ] && [ -f "paper/build/${PDF_NAME}" ]; then
            pages=$(pdfinfo "paper/build/${PDF_NAME}" | awk '/^Pages:/ {print $2}')
            checksum=$(sha256sum "paper/build/${PDF_NAME}" | awk '{print $1}')
            body=$(cat <<EOF
          Paper v0 release build: **SUCCESS**

          - Source: \`${SOURCE_SHA}\`
          - Release: \`${RELEASE_TAG}\`
          - PDF: [\`${PDF_NAME}\`](${asset_url})
          - Pages: ${pages}
          - SHA-256: \`${checksum}\`
          - Internal appendices A/E/F excluded; scientific appendices B-D retained.
          - Workflow run: ${run_url}
          EOF
          )
          else
            body=$(cat <<EOF
          Paper v0 release build: **${JOB_STATUS^^}**

          - Source: \`${SOURCE_SHA}\`
          - Intended release: \`${RELEASE_TAG}\`
          - Workflow run: ${run_url}
          EOF
          )
          fi

          gh api "repos/${GITHUB_REPOSITORY}/issues/123/comments" -f body="$body"
