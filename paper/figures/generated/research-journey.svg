   <g id="text_1">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(29.360299 48.655464)">Q  Physical service?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(25.782658 54.422337)">O  Exposed NVMe wait</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(25.184775 60.189211)">D  Optimize exact path</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(49.473463 65.956084)">#58</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(26.64126 71.722958)">MEASURED_PHYSICAL</text>
   </g>
   <g id="text_2">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(120.706265 48.727081)">Q  Cheaper exact misses?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(125.210503 54.493955)">O  Feed/overlap gains;</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(124.306035 60.260828)">    service cost remains</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(127.307519 66.027702)">D  Keep service fixes</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(129.279808 71.794575)">#69/#73 · PROFILE</text>
   </g>
   <g id="text_3">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(224.687434 48.655464)">Q  Just add residency?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(224.751407 54.422337)">O  Reclaim/refault cliff</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(217.389321 60.189211)">D  Safety-derived AUTO cap</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(247.942903 65.956084)">#89</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(225.1107 71.722958)">MEASURED_PHYSICAL</text>
   </g>
   <g id="text_4">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(323.172588 48.727081)">Q  Can demand move?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(316.442182 54.493955)">O  Bounded near-tie frontier</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(324.379619 60.260828)">D  Conservative KNEE</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(347.177623 66.027702)">#77</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(323.990955 71.794575)">REPLAY + PREDICTIVE</text>
   </g>
   <g id="text_5">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(21.20117 135.763247)">Q  Which bounded shape?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(16.01858 141.53012)">O  High-cache physical screen</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(22.537756 147.296994)">D  S2_P50 replaces KNEE</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(49.473463 153.207102)">#98</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(26.64126 158.973975)">MEASURED_PHYSICAL</text>
   </g>
   <g id="text_6">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(125.827699 135.834864)">Q  Does it generalize?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(120.394851 141.601738)">O  Full-prompt 16 × 8 grid</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(114.694445 147.368611)">D  Workload-conditioned claim</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(147.069839 153.135484)">#102</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(125.87598 158.902358)">MEASURED_PHYSICAL</text>
   </g>
   <g id="text_7">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(222.619387 135.834864)">Q  Simpler locality rule?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(212.927329 141.601738)">O  Feature limited; pinning fails</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(218.316723 147.368611)">D  Keep dynamic residency</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(246.304559 153.135484)">#105</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(211.707423 158.902358)">POST_HOC + COUNTERFACTUAL</text>
   </g>
   <g id="text_8">
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(328.728955 135.906481)">Q  Predictive cost?</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(318.749221 141.673355)">O  ΔNLL + token feedback</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(317.646799 147.440228)">D  No simple risk controller</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(347.177623 153.207102)">#99</text>
    <text style="fill: #202124; font: 5.15px 'DejaVu Sans'" transform="translate(320.932338 158.973975)">DIRECT + FREE QUALITY</text>
   </g>
